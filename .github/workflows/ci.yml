name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend – Spring Boot
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: prani-be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build & test backend
        run: ./gradlew clean test

  frontend:
    name: Frontend – Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: prani-fe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prani-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        # pokud zatím nemáš testy, můžeš tento krok zakomentovat

      - name: Build frontend
        run: npm run build
