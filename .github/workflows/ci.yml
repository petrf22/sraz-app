name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sraz-be
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # build = kompilace + testy (Testcontainers Postgres, Docker na runneru je)
      - run: ./gradlew build

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sraz-fe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sraz-fe/package-lock.json
      - run: npm ci
      # Vygenerované GraphQL typy se commitují – musí odpovídat schématu backendu
      - run: npm run codegen
      - run: git diff --exit-code src/app/graphql
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build
