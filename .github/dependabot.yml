version: 2
updates:
  - package-ecosystem: gradle
    directory: /sraz-be
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /sraz-fe
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'ng-zorro-antd'
      # Každé PR mění package-lock.json – drobné aktualizace chodí v jednom PR týdně,
      # major zvlášť (chce posoudit samostatně).
      npm-drobne:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
