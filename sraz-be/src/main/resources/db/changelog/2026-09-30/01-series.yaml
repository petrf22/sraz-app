# Opakované akce: série → období (pravidlo opakování, čas, kapacita) → vygenerované termíny.
# Připomínky: připomínka přihlášeným před začátkem a souhrn organizátorům po uzávěrce.
databaseChangeLog:

  - changeSet:
      id: 2026-09-30-10-event-series
      author: Petr F.
      changes:
        - createTable:
            tableName: event_series
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: group_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_event_series_group, references: sport_groups(id), deleteCascade: true } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: CURRENT_TIMESTAMP }

  # Období série – days_of_week: "MONDAY,THURSDAY"; month_weeks (jen MONTHLY): "1,3" = 1. a 3. výskyt dne v měsíci, "-1" = poslední
  - changeSet:
      id: 2026-09-30-20-series-periods
      author: Petr F.
      changes:
        - createTable:
            tableName: series_periods
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: series_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_series_periods_series, references: event_series(id), deleteCascade: true } }
              - column: { name: valid_from, type: DATE, constraints: { nullable: false } }
              - column: { name: valid_to, type: DATE, constraints: { nullable: false } }
              - column: { name: recurrence, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: interval_count, type: INT, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: days_of_week, type: VARCHAR(80), constraints: { nullable: false } }
              - column: { name: month_weeks, type: VARCHAR(20) }
              - column: { name: start_time, type: TIME, constraints: { nullable: false } }
              - column: { name: duration_minutes, type: INT, constraints: { nullable: false } }
              - column: { name: venue_id, type: BIGINT, constraints: { foreignKeyName: fk_series_periods_venue, references: venues(id), deleteSetNull: true } }
              - column: { name: max_players_per_team, type: INT, constraints: { nullable: false } }
              - column: { name: max_goalies, type: INT, constraints: { nullable: false } }
              - column: { name: deadline_hours_before, type: INT, constraints: { nullable: false } }
              - column: { name: invite_regulars_hours_before, type: INT, constraints: { nullable: false } }
              - column: { name: invite_substitutes_hours_before, type: INT, constraints: { nullable: false } }
              - column: { name: reminder_hours_before, type: INT }
              - column: { name: note, type: TEXT }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: CURRENT_TIMESTAMP }

  # detached = termín organizátor upravil ručně → přegenerování období ho nepřepíše
  - changeSet:
      id: 2026-09-30-30-events-series-reminders
      author: Petr F.
      changes:
        - addColumn:
            tableName: events
            columns:
              - column: { name: series_id, type: BIGINT, constraints: { foreignKeyName: fk_events_series, references: event_series(id), deleteSetNull: true } }
              - column: { name: period_id, type: BIGINT, constraints: { foreignKeyName: fk_events_period, references: series_periods(id), deleteSetNull: true } }
              - column: { name: detached, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: reminder_hours_before, type: INT }
              - column: { name: reminder_sent_at, type: TIMESTAMPTZ }
              - column: { name: deadline_summary_sent_at, type: TIMESTAMPTZ }
        - createIndex:
            tableName: events
            indexName: ix_events_period
            columns:
              - column: { name: period_id }
