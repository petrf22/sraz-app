# Peníze: cena ledu a poplatek stálého člena (období/akce), potvrzení účasti, platby a bank skupiny.
databaseChangeLog:

  - changeSet:
      id: 2026-09-30-40-group-iban
      author: Petr F.
      changes:
        - addColumn:
            tableName: sport_groups
            columns:
              - column: { name: iban, type: VARCHAR(34) }

  - changeSet:
      id: 2026-09-30-50-pricing
      author: Petr F.
      changes:
        - addColumn:
            tableName: series_periods
            columns:
              - column: { name: price_per_hour, type: "DECIMAL(10,2)" }
              - column: { name: regular_fee, type: "DECIMAL(10,2)" }
        - addColumn:
            tableName: events
            columns:
              - column: { name: price_per_hour, type: "DECIMAL(10,2)" }
              - column: { name: regular_fee, type: "DECIMAL(10,2)" }
              - column: { name: closed_at, type: TIMESTAMPTZ }
        # null = účast zatím nepotvrzena
        - addColumn:
            tableName: registrations
            columns:
              - column: { name: attended, type: BOOLEAN }

  # Platba účastníka za termín – variabilní symbol = id
  - changeSet:
      id: 2026-09-30-60-charges
      author: Petr F.
      changes:
        - createTable:
            tableName: charges
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: event_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_charges_event, references: events(id), deleteCascade: true } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_charges_user, references: users(id), deleteCascade: true } }
              - column: { name: kind, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: amount, type: "DECIMAL(10,2)", constraints: { nullable: false } }
              - column: { name: paid_at, type: TIMESTAMPTZ }
              - column: { name: paid_method, type: VARCHAR(20) }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: CURRENT_TIMESTAMP }
        - addUniqueConstraint:
            tableName: charges
            columnNames: event_id, user_id
            constraintName: uq_charges_event_user

  # Bank skupiny = součet pohybů (přebytky/schodky z akcí a ruční pohyby)
  - changeSet:
      id: 2026-09-30-70-bank-entries
      author: Petr F.
      changes:
        - createTable:
            tableName: bank_entries
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: group_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_bank_entries_group, references: sport_groups(id), deleteCascade: true } }
              - column: { name: kind, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: amount, type: "DECIMAL(10,2)", constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: event_id, type: BIGINT, constraints: { foreignKeyName: fk_bank_entries_event, references: events(id), deleteSetNull: true } }
              - column: { name: created_by, type: BIGINT, constraints: { foreignKeyName: fk_bank_entries_user, references: users(id), deleteSetNull: true } }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: CURRENT_TIMESTAMP }
