# Výchozí nastavení = lokální vývoj (jako kvalita-cena). Produkci přepisuje application-prod.properties
# (SPRING_PROFILES_ACTIVE=prod v compose.prod.yaml), kde chybějící proměnná prostředí appku shodí hned při startu.
spring.application.name=sraz
server.port=8080

# Dev Postgres z ../compose.yaml – spring-boot-docker-compose ho při bootRun sám nastartuje
spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start-only
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/sraz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# Schéma vlastní Liquibase, Hibernate ho jen ověřuje
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.liquibase.contexts=prod

# Podpis access tokenů – dev hodnota, v produkci JWT_SECRET (application-prod.properties)
jwt.secret=${JWT_SECRET:fQmgv+o4PSU48vzHHrHy9njx/v4+K3JffqYIcsXtyHRCn5KRI2MsUqF0+9uVBy//n5ag0ddTcGeZ63wXXz1ung==}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

# Dev e-mail = Mailpit (docker run -p 1025:1025 -p 8025:8025 axllent/mailpit), přihlašovací kódy jdou jen do logu
spring.mail.host=localhost
spring.mail.port=1025
app.auth.otp.mail-enabled=false
app.auth.cookie-secure=false
app.mail.from=Sraz <noreply@localhost>
app.frontend-url=http://localhost:4200
app.security.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

logging.level.cz.petrf=DEBUG

app.disposable.blocklist-urls[0]=https://raw.githubusercontent.com/disposable-email-domains/disposable-email-domains/main/disposable_email_blocklist.conf
app.disposable.blocklist-urls[1]=https://disposable.github.io/disposable-email-domains/domains.txt
app.disposable.update-interval-hours=24
