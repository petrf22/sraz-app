# Produkce (compose.prod.yaml, SPRING_PROFILES_ACTIVE=prod). Placeholdery bez výchozí hodnoty jsou záměr:
# chybějící proměnná v .env appku shodí hned při startu, ne až při prvním e-mailu.
spring.docker.compose.enabled=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.graphql.graphiql.enabled=false
spring.graphql.schema.introspection.enabled=false

# SMTP přes STARTTLS 587 (Hetzner blokuje odchozí 25 a 465)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
management.health.mail.enabled=true

# INFO, ne DEBUG – dev úroveň by logovala mimo jiné e-mailové adresy a obsah e-mailů
logging.level.cz.petrf=INFO

jwt.secret=${JWT_SECRET}
app.auth.otp.mail-enabled=true
app.auth.cookie-secure=true
app.mail.from=${SMTP_FROM}
# Veřejná adresa webu – odkazy v e-mailech (pozvánky, přihláška na akci)
app.frontend-url=${SITE_ADDRESS}
app.security.allowed-origins=${SITE_ADDRESS}
# Šifrování tokenů Fio API v DB (openssl rand -base64 32) – změna klíče zneplatní uložené tokeny
app.fio.token-key=${FIO_TOKEN_KEY}
