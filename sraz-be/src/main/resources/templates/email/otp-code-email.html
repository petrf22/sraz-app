<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #1677ff; color: white; padding: 10px; text-align: center; }
        .code { font-size: 32px; font-weight: bold; letter-spacing: 6px; text-align: center; margin: 24px 0; }
        .footer { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <hgroup class="header">
        <h1>Sraz</h1>
        <p>Přihlašovací kód</p>
    </hgroup>

    <p>Váš přihlašovací kód je:</p>

    <p class="code" th:text="${code}">123456</p>

    <p>Kód platí <strong th:text="${minutes}">10</strong> minut a lze ho použít jen jednou.</p>

    <div class="footer">
        <p>Pokud jste o kód nežádali, tento e-mail ignorujte.</p>
    </div>
</div>
</body>
</html>
