<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #1677ff; color: white; padding: 10px; text-align: center; }
        .amount { font-size: 28px; font-weight: bold; text-align: center; margin: 16px 0; }
        .footer { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <hgroup class="header">
        <h1 th:text="${eventName}">Akce</h1>
        <p th:text="${startsAt}">datum</p>
    </hgroup>

    <p>Ahoj <strong th:text="${playerName}">hráči</strong>, díky za účast. Za tuto akci platíš:</p>

    <p class="amount" th:text="${amount} + ' Kč'">200 Kč</p>

    <p th:if="${iban}">
        Účet (IBAN): <strong th:text="${iban}">CZ…</strong><br>
        Variabilní symbol: <strong th:text="${variableSymbol}">123</strong><br>
        Nebo zaplať hotově organizátorovi.
    </p>
    <p th:unless="${iban}">Zaplať prosím organizátorovi.</p>

    <p><a th:href="${paymentsUrl}">Moje platby a QR kód</a></p>

    <div class="footer">
        <p>Tento e-mail byl odeslán automaticky, neodpovídejte na něj.</p>
    </div>
</div>
</body>
</html>
