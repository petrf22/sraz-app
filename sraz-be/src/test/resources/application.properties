# Postgres pro testy poskytuje Testcontainers (viz TestcontainersConfiguration + @ServiceConnection).
# Schéma vytváří Liquibase; context "test" pustí schema changesety a přeskočí "dev" seed data.
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.contexts=test

# Mail configuration for tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test

# Přihlašování kódem – v testech bez limitu na IP a bez tolerance opakovaného použití refresh tokenu
