<div nz-row>
  <div nz-col nzXs="24" [nzMd]="{ span: 10, offset: 7 }">
    <nz-card nzTitle="Přihlášení">
      @if (errorMessage()) {
        <nz-alert nzType="error" [nzMessage]="errorMessage()!" nzShowIcon class="space-bottom"></nz-alert>
      }

      @if (step() === 'email') {
        <form nz-form ngNoForm novalidate nzLayout="vertical" (submit)="$event.preventDefault(); requestCode()">
          <nz-form-item>
            <nz-form-label>E-mail</nz-form-label>
            <nz-form-control>
              <input nz-input type="email" name="email" autocomplete="email" required
                [ngModel]="email()" (ngModelChange)="email.set($event)" />
            </nz-form-control>
          </nz-form-item>
          <p class="hint">Pošleme vám šestimístný kód – žádné heslo si nemusíte pamatovat.</p>
          <label nz-checkbox name="consent" [ngModel]="consentGiven()" (ngModelChange)="consentGiven.set($event)">
            Souhlasím se zpracováním e-mailu a údajů o účasti pro potřeby aplikace (nutné jen při prvním přihlášení).
          </label>
          <button nz-button nzType="primary" nzBlock type="submit" class="space-top" [nzLoading]="sendingCode()">
            Poslat kód
          </button>
        </form>
      } @else {
        <form nz-form ngNoForm novalidate nzLayout="vertical" (submit)="$event.preventDefault(); verifyCode()">
          <p class="hint">Kód jsme poslali na <strong>{{ email() }}</strong>. Odeslání může chvíli trvat.</p>
          <nz-form-item>
            <nz-form-label>Kód z e-mailu</nz-form-label>
            <nz-form-control>
              <input nz-input name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required
                [ngModel]="code()" (ngModelChange)="code.set($event)" />
            </nz-form-control>
          </nz-form-item>
          <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="verifying()">Přihlásit</button>
          <button nz-button nzType="link" nzBlock type="button" [nzLoading]="sendingCode()"
            [disabled]="resendCooldown() > 0" (click)="requestCode()">
            {{ resendCooldown() > 0 ? 'Poslat znovu (za ' + resendCooldown() + ' s)' : 'Poslat kód znovu' }}
          </button>
          <button nz-button nzType="link" nzBlock type="button" (click)="backToEmail()">Změnit e-mail</button>
        </form>
      }
    </nz-card>
  </div>
</div>
